name: Build and Deploy

on:
  push:
    branches:
      - main
      - claude/setup-wordpress-sftp-KBSje
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: |
          echo "Building static homepage and index.php..."
          python3 scripts/build.py

      - name: Deploy via FTP
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: python3 scripts/deploy.py

      - name: Smoke test
        run: |
          sleep 5
          HTTP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "https://io2.agency/")
          echo "Homepage HTTP status: $HTTP"
          [ "$HTTP" = "200" ] && echo "✓ Site is live" || echo "⚠ Got $HTTP"
