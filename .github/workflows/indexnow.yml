# Ping IndexNow (Bing, Yandex, Seznam, Naver, ...) with every URL in sitemap.xml
# after each push to main, once GitHub Pages has published the new version.
name: IndexNow

on:
  push:
    branches: [main]
    paths-ignore: ["README.md", "tools/**", ".github/**"]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Wait for GitHub Pages to publish
        run: sleep 90
      - name: Submit sitemap URLs to IndexNow
        run: |
          KEY=$(basename "$(ls ./*.txt | grep -E '/[0-9a-f]{32}\.txt$' | head -1)" .txt)
          URLS=$(grep -oE '<loc>https://io2\.agency[^<]*</loc>' sitemap.xml | sed -E 's#</?loc>##g' | sort -u | python3 -c 'import sys,json;print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')
          echo "Key: $KEY"; echo "URLs: $URLS"
          BODY=$(printf '{"host":"io2.agency","key":"%s","keyLocation":"https://io2.agency/%s.txt","urlList":%s}' "$KEY" "$KEY" "$URLS")
          CODE=$(curl -s -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
                 -H 'Content-Type: application/json; charset=utf-8' -d "$BODY")
          echo "IndexNow HTTP $CODE"; cat resp.txt || true
          case "$CODE" in 200|202) exit 0;; *) exit 1;; esac
